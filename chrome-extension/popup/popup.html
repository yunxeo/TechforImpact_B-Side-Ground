<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>챗풀Chatpull</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="header">
        <div>
          <h1 class="text-h1">챗풀Chatpull</h1>
          <p class="text-body-m">ChatGPT · Gemini 지원</p>
        </div>
        <label class="switch" title="확장 프로그램 켜기/끄기">
          <input id="enabled" type="checkbox" />
          <span></span>
        </label>
      </header>

      <section class="card report-card">
        <span class="eyebrow text-body-s">Prompting Report</span>
        <h2 class="text-h2">오늘의 프롬프팅 리포트</h2>

        <div class="report-header">
          <div class="report-date text-body-s" id="reportDate">오늘 기준</div>
          <button class="report-refresh text-body-s" id="refreshReport" type="button">새로고침</button>
        </div>

        <div id="reportStatus" class="report-status text-body-m" hidden></div>

        <div class="puri-comment">
          <img class="puri-img" id="puriReportImg" alt="" width="44" height="44" />
          <div class="puri-bubble text-body-l">
            <span id="puriReportMsg">오늘도 간결하게 잘 쓰고 있어요!</span>
          </div>
        </div>

        <div class="report-insights" id="reportInsights"></div>

        <div class="level-mix">
          <p class="level-mix-title text-h3">오늘 프롬프트 길이 느낌</p>
          <div class="level-bar">
            <div class="level-seg low" id="lowRatio"></div>
            <div class="level-seg medium" id="mediumRatio"></div>
            <div class="level-seg high" id="highRatio"></div>
          </div>
          <div class="level-legend">
            <span class="legend-item text-body-m">
              <span class="legend-dot low-dot"></span>낮음
            </span>
            <span class="legend-item text-body-m">
              <span class="legend-dot medium-dot"></span>중간
            </span>
            <span class="legend-item text-body-m">
              <span class="legend-dot high-dot"></span>높음
            </span>
          </div>
          <p class="level-mix-note text-body-m" id="levelMixNote"></p>
        </div>

        <div class="week-calendar">
          <div class="week-label text-body-s">최근 7일</div>
          <div class="week-days" id="weekDays"></div>
        </div>
      </section>

      <section class="card usage-card">
        <span class="eyebrow text-body-s">Usage Guide</span>
        <h2 class="text-h2">처음 사용 팁</h2>
        <p class="help-text text-body-m">ChatGPT·Gemini 입력창 위 챗풀 배지와 팁 사용법을 다시 볼 수 있어요.</p>
        <button id="openGuide" class="secondary text-body-l" type="button">사용 팁 열기</button>
      </section>

      <section class="card tips-card">
        <span class="eyebrow text-body-s">Prompt Guide</span>
        <h2 class="text-h2">프롬프트 팁 모음</h2>
        <p class="help-text text-body-m"><span id="tipTotal">0</span>개의 프롬프팅 팁을 확인해보세요</p>
        <button id="openTips" class="secondary text-body-l" type="button">팁 모음 열기</button>

        <section id="tipLibrary" class="tip-library" hidden>
          <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="프롬프트 팁 카테고리"></div>
          <div class="tip-list-head">
            <strong id="activeCategoryName" class="text-h3">전체</strong>
            <span id="activeCategoryCount" class="text-body-s">0개</span>
          </div>
          <div id="tipList" class="tip-list"></div>
        </section>
      </section>

      <footer class="footer">
        <button id="openChatGPT" class="text-body-l" type="button">ChatGPT 열기</button>
        <button id="openGemini" class="text-body-l" type="button">Gemini 열기</button>
      </footer>
    </main>
    <script src="../content/prompt-tips.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
